[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-pilot"
version = "0.1.0"
description = "Cross-platform GUI automation SDK for AI agents — structured element access, OCR fallback, and LLM-friendly APIs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DesktopPilot Contributors" }]
requires-python = ">=3.9"
keywords = ["ai", "agent", "automation", "gui", "uia", "accessibility", "computer-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyautogui>=0.9.54",
    "Pillow>=10.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
vision = ["pytesseract>=0.3.10", "opencv-python>=4.8"]
langchain = ["langchain-core>=0.1"]
all = [
    "pytesseract>=0.3.10",
    "opencv-python>=4.8",
    "langchain-core>=0.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "types-Pillow",
]

[project.urls]
Homepage = "https://github.com/example/desktop-pilot"
Documentation = "https://github.com/example/desktop-pilot#readme"
Issues = "https://github.com/example/desktop-pilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop_pilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real GUI / display",
    "slow: takes more than a few seconds",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict_optional = true
warn_unused_ignores = true
